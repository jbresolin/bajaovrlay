<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Faixa — faixa inferior e terço inferior</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="plate lower-strip" data-graphic="lower-strip">
  <div class="strip-clock">
    <div class="strip-time">1:16:00</div>
    <div class="strip-flag" data-flag="green"><span>VERDE</span></div>
  </div>
  <div class="strip-cars" data-page="1">
    <div class="strip-car is-leader" data-row><span class="strip-position">1</span><span class="strip-number">31</span><span class="strip-school">Mauá</span></div>
    <div class="strip-car" data-row><span class="strip-position">2</span><span class="strip-number">38</span><span class="strip-school">EESC-USP</span></div>
    <div class="strip-car" data-row><span class="strip-position">3</span><span class="strip-number">25</span><span class="strip-school">UFES</span></div>
    <div class="strip-car" data-row><span class="strip-position">4</span><span class="strip-number">78</span><span class="strip-school">UNIFEI</span></div>
    <div class="strip-car" data-row><span class="strip-position">5</span><span class="strip-number">52</span><span class="strip-school">UFG</span></div>
  </div>
  <div class="strip-page">1/12</div>
</div>
<div class="plate lower-third" data-graphic="lower-third">
  <div class="person-name">Mariana Costa</div>
  <div class="ribbon ribbon-float person-role"><span>Capitã da equipe</span></div>
  <div class="person-team"><span class="team-badge">31</span><span>Acauã Baja · Mauá</span></div>
</div>
</body>
</html>
