<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Faixa — relógio de prova</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="plate race-clock" data-graphic="race-clock">
  <div class="ribbon ribbon-flush"><span>Enduro de Resistência</span></div>
  <div class="clock-body">
    <div class="clock-time">1:16:00</div>
    <div class="clock-side">
      <div class="caption">TEMPO RESTANTE</div>
      <div class="clock-laps">34 VOLTAS</div>
    </div>
  </div>
  <div class="ribbon ribbon-flush flag-band" data-flag="green"><span class="flag-word">VERDE</span></div>
</div>
