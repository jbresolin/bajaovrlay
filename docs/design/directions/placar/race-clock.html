<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>placar — race clock</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="race-clock plate" data-graphic="race-clock">
  <div class="race-clock__board spine">
    <div class="race-clock__session">Enduro de Resistência</div>
    <div class="race-clock__time-row">
      <div class="race-clock__time">1:16:00</div>
      <div class="race-clock__details">
        <div class="race-clock__caption">TEMPO RESTANTE</div>
        <div class="race-clock__laps">34 VOLTAS</div>
      </div>
    </div>
  </div>
  <div class="race-clock__flag"><div class="flag-band flag-surface" data-flag="green"><span class="flag-word">VERDE</span></div></div>
</section>
</body>
</html>
