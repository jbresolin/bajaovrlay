<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ardosia — combo strip</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="lower-strip" data-graphic="lower-strip">
  <div class="card lower-strip__clock">
    <span class="lower-strip__time">1:16:00</span>
    <span class="lower-strip__flag flag-surface flag-pill" data-flag="green"><span class="flag-word">VERDE</span></span>
  </div>
  <div class="lower-strip__pages">
  <ol class="lower-strip__cars">
    <li class="pill strip-car" data-row data-status="running" data-leader>
      <span class="strip-car__pos">1</span>
      <span class="strip-car__car chip">31</span>
      <span class="strip-car__school">Mauá</span>
    </li>
    <li class="pill strip-car" data-row data-status="running">
      <span class="strip-car__pos">2</span>
      <span class="strip-car__car chip">38</span>
      <span class="strip-car__school">EESC-USP</span>
    </li>
    <li class="pill strip-car" data-row data-status="running">
      <span class="strip-car__pos">3</span>
      <span class="strip-car__car chip">25</span>
      <span class="strip-car__school">UFES</span>
    </li>
    <li class="pill strip-car" data-row data-status="running">
      <span class="strip-car__pos">4</span>
      <span class="strip-car__car chip">78</span>
      <span class="strip-car__school">UNIFEI</span>
    </li>
    <li class="pill strip-car" data-row data-status="running">
      <span class="strip-car__pos">5</span>
      <span class="strip-car__car chip">52</span>
      <span class="strip-car__school">UFG</span>
    </li>
    <li class="pill strip-car" data-row data-status="running">
      <span class="strip-car__pos">6</span>
      <span class="strip-car__car chip">47</span>
      <span class="strip-car__school">UFERSA</span>
    </li>
  </ol>
  </div>
  <div class="card lower-strip__page">1/10</div>
</section>
<section class="lower-third" data-graphic="lower-third">
  <div class="card lower-third__name">Mariana Costa</div>
  <div class="card lower-third__role"><span class="chip lower-third__car">31</span><span class="lower-third__role-text">Capitã da equipe</span><span class="lower-third__team">Acauã Baja · Mauá</span></div>
</section>
</body>
</html>
