<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — sponsor roll, full screen</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="board board--narrow sponsor-roll" data-graphic="sponsor-roll" data-page="1">
      <header class="card board__head">
        <img class="board__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
        <h1 class="board__title">Patrocinadores</h1>
        <span class="caption board__subtitle">Patrocínio Diamante</span>
        <span class="board__aside">1/5</span>
      </header>
      <div class="sponsor-roll__grid">
        <div class="card sponsor-tile">
          <span class="logo logo--on-light sponsor-tile__logo"
            ><img
              class="logo__image"
              src="../../sample_data/logos/sponsors/bosch.webp"
              alt="Bosch"
              width="480"
              height="138"
          /></span>
        </div>
        <div class="card sponsor-tile">
          <span class="logo logo--on-light sponsor-tile__logo"
            ><img
              class="logo__image"
              src="../../sample_data/logos/sponsors/renault.webp"
              alt="Renault"
              width="150"
              height="56"
          /></span>
        </div>
      </div>
    </section>
  </body>
</html>
