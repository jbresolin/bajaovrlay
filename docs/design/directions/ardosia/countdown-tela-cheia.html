<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — countdown, full screen</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="board board--narrow countdown-board" data-graphic="countdown-board">
      <header class="card board__head">
        <img class="board__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
        <h1 class="board__title">Próxima sessão</h1>
        <span class="caption board__subtitle">30ª Competição Baja SAE Brasil</span>
        <span class="board__aside">domingo, 30 de março de 2025</span>
      </header>
      <div class="card countdown-board__body">
        <span class="countdown-board__session">Enduro de Resistência</span>
        <span class="countdown-board__time">23:45</span>
        <span class="countdown-board__start">LARGADA ÀS 10:00</span>
      </div>
    </section>
  </body>
</html>
