<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — combo: clock, bug and battle card</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="card race-clock" data-graphic="race-clock">
      <header class="race-clock__head">
        <img class="race-clock__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
        <h1 class="race-clock__title">Enduro de Resistência</h1>
      </header>
      <div class="race-clock__body">
        <span class="race-clock__caption">TEMPO RESTANTE</span>
        <span class="race-clock__time">1:16:00</span>
        <span class="race-clock__laps">34 VOLTAS</span>
      </div>
      <div class="race-clock__flag flag-surface" data-flag="green">
        <span class="flag-word">VERDE</span>
      </div>
    </section>
    <section class="card sponsor-bug" data-graphic="sponsor-bug">
      <img class="sponsor-bug__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
      <span class="sponsor-bug__label">ENDURO</span>
      <span class="sponsor-bug__sponsor"
        ><span class="caption">Apresentado por</span
        ><span class="sponsor-bug__sponsor-name">Metalúrgica Serrana</span></span
      >
    </section>
    <section class="battle-card" data-graphic="battle-card" data-trend="closing">
      <div class="pill battle-car" data-row>
        <span class="row__pos">4</span>
        <span class="chip">78</span>
        <span class="battle-car__team"
          ><span class="battle-car__name">Arara Off-Road</span
          ><span class="battle-car__school">UNIFEI</span></span
        >
        <span class="battle-car__laps">33 VOLTAS</span>
      </div>
      <div class="card battle-gap">
        <span class="battle-gap__value">+8,3</span>
        <span class="battle-gap__trend"
          ><svg viewBox="0 0 24 10" aria-hidden="true">
            <path d="M0 0l9 5-9 5z" fill="currentColor" />
            <path d="M24 0l-9 5 9 5z" fill="currentColor" /></svg
          ><span>FECHANDO −0,7</span></span
        >
      </div>
      <div class="pill battle-car" data-row>
        <span class="row__pos">5</span>
        <span class="chip">52</span>
        <span class="battle-car__team"
          ><span class="battle-car__name">Pequi Off-Road</span
          ><span class="battle-car__school">UFG</span></span
        >
        <span class="battle-car__laps">33 VOLTAS</span>
      </div>
    </section>
  </body>
</html>
