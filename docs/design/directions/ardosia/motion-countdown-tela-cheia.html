<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — movimento: Contagem regressiva · tela cheia</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="demo-controls" aria-label="Controles da demonstração">
      <a class="demo-controls__back" href="motion-catalogo.html">Catálogo</a>
      <span class="demo-controls__title">Contagem regressiva · tela cheia</span>
      <button type="button" class="demo-controls__button" data-action="enter">Entrar</button>
      <button type="button" class="demo-controls__button" data-action="exit">Sair</button>
      <span class="demo-controls__status" id="demo-status" role="status"></span>
    </nav>
    <div class="demo-stage" data-demo="countdown-board">
      <section class="board board--narrow countdown-board" data-graphic="countdown-board">
        <header class="card board__head">
          <img class="board__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
          <h1 class="board__title">Próxima sessão</h1>
          <span class="caption board__subtitle">Baja SAE Brasil 2027 — Etapa Nacional</span>
          <span class="board__aside">sábado, 20 de março de 2027</span>
        </header>
        <div class="card countdown-board__body">
          <span class="countdown-board__session">Suspensão</span>
          <span class="countdown-board__time">23:45</span>
          <span class="countdown-board__start">LARGADA ÀS 13:30</span>
        </div>
      </section>
    </div>

    <script type="application/json" id="demo-config">
      { "remainingSeconds": 1425 }
    </script>

    <script src="../../../../node_modules/.pnpm/node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../../../../node_modules/.pnpm/node_modules/gsap/dist/CustomEase.min.js"></script>
    <script src="../../tools/motionDemoCore.js"></script>
    <script src="../../tools/motionDemoBoards.js"></script>
  </body>
</html>
