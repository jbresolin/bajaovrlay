<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — countdown</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="card race-clock race-clock--no-flag countdown" data-graphic="countdown">
      <header class="race-clock__head">
        <img class="race-clock__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
        <h1 class="race-clock__title">Suspensão</h1>
      </header>
      <div class="race-clock__body">
        <span class="race-clock__caption">LARGADA EM</span>
        <span class="race-clock__time">23:45</span>
        <span class="race-clock__laps countdown__start">ÀS 13:30</span>
      </div>
    </section>
  </body>
</html>
