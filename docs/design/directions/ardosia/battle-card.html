<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — battle card</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="battle-card" data-graphic="battle-card">
      <div class="pill battle-car" data-row>
        <span class="row__pos">4</span>
        <span class="chip">8</span>
        <span class="battle-car__team"
          ><span class="battle-car__name">Imperador</span
          ><span class="battle-car__school">UTFPR-CWB</span></span
        >
        <span class="battle-car__laps">1 VOLTA</span>
      </div>
      <div class="card battle-gap">
        <span class="battle-gap__value">+2,0</span>
        <span class="battle-gap__trend" data-trend="closing"
          ><svg viewBox="0 0 24 10" aria-hidden="true">
            <path d="M0 0l9 5-9 5z" fill="currentColor" />
            <path d="M24 0l-9 5 9 5z" fill="currentColor" /></svg
          ><span class="battle-gap__trend-words">FECHANDO −1,0</span></span
        >
      </div>
      <div class="pill battle-car" data-row>
        <span class="row__pos">5</span>
        <span class="chip">1</span>
        <span class="battle-car__team"
          ><span class="battle-car__name">Equipe FEI Baja</span
          ><span class="battle-car__school">FEI</span></span
        >
        <span class="battle-car__laps">1 VOLTA</span>
      </div>
    </section>
  </body>
</html>
