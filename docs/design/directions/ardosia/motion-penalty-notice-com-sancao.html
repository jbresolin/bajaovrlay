<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — movimento: Penalidade ou incidente · com sanção</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="demo-controls" aria-label="Controles da demonstração">
      <a class="demo-controls__back" href="motion-catalogo.html">Catálogo</a>
      <span class="demo-controls__title">Penalidade ou incidente · com sanção</span>
      <button type="button" class="demo-controls__button" data-action="enter">Entrar</button>
      <button type="button" class="demo-controls__button" data-action="exit">Sair</button>
      <button type="button" class="demo-controls__button" data-action="newEvent">
        Novo evento
      </button>
      <span class="demo-controls__status" id="demo-status" role="status"></span>
    </nav>
    <div class="demo-stage" data-demo="notices">
      <section
        class="card notice penalty-notice"
        data-graphic="penalty-notice"
        data-notice="penalty"
      >
        <header class="notice__head">
          <span class="notice__badge notice__badge--warning"
            ><svg class="status-icon" viewBox="0 0 20 20" role="img" aria-label="Aviso">
              <path
                d="M10 2.4 18.6 17.2H1.4z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <path
                d="M10 7.6v4.2"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
              <circle cx="10" cy="14.4" r="1.2" fill="currentColor" /></svg
            ><span>PENALIDADE</span></span
          >
          <span class="caption">DIREÇÃO DE PROVA</span>
        </header>
        <div class="notice__row">
          <span class="chip">47</span>
          <span class="notice__team"
            ><span class="notice__team-name">Carnaúba Baja</span
            ><span class="notice__school">UFERSA</span></span
          >
        </div>
        <div class="notice__row notice__row--reason">
          <span class="notice__reason">Queima de largada</span>
          <span class="notice__penalty">+30 segundos</span>
        </div>
      </section>
    </div>
    <template id="event-own">
      <section
        class="card notice penalty-notice"
        data-graphic="penalty-notice"
        data-notice="penalty"
      >
        <header class="notice__head">
          <span class="notice__badge notice__badge--warning"
            ><svg class="status-icon" viewBox="0 0 20 20" role="img" aria-label="Aviso">
              <path
                d="M10 2.4 18.6 17.2H1.4z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <path
                d="M10 7.6v4.2"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
              <circle cx="10" cy="14.4" r="1.2" fill="currentColor" /></svg
            ><span>PENALIDADE</span></span
          >
          <span class="caption">DIREÇÃO DE PROVA</span>
        </header>
        <div class="notice__row">
          <span class="chip">47</span>
          <span class="notice__team"
            ><span class="notice__team-name">Carnaúba Baja</span
            ><span class="notice__school">UFERSA</span></span
          >
        </div>
        <div class="notice__row notice__row--reason">
          <span class="notice__reason">Queima de largada</span>
          <span class="notice__penalty">+30 segundos</span>
        </div>
      </section>
    </template>
    <template id="event-fastest-lap">
      <section class="card notice fastest-lap" data-graphic="fastest-lap">
        <header class="notice__head">
          <span class="notice__badge notice__badge--best">MELHOR VOLTA</span>
          <span class="caption">VOLTA 34</span>
        </header>
        <div class="notice__row">
          <span class="chip">31</span>
          <span class="notice__team"
            ><span class="notice__team-name">Acauã Baja</span
            ><span class="notice__school">Mauá</span></span
          >
          <span class="notice__time">4:38,2</span>
        </div>
      </section>
    </template>
    <template id="event-incident">
      <section
        class="card notice penalty-notice"
        data-graphic="penalty-notice"
        data-notice="incident"
      >
        <header class="notice__head">
          <span class="notice__badge notice__badge--warning"
            ><svg class="status-icon" viewBox="0 0 20 20" role="img" aria-label="Aviso">
              <path
                d="M10 2.4 18.6 17.2H1.4z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <path
                d="M10 7.6v4.2"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
              <circle cx="10" cy="14.4" r="1.2" fill="currentColor" /></svg
            ><span>INCIDENTE</span></span
          >
          <span class="caption">DIREÇÃO DE PROVA</span>
        </header>
        <div class="notice__row">
          <span class="chip">13</span>
          <span class="notice__team"
            ><span class="notice__team-name">Juriti Off-Road</span
            ><span class="notice__school">UDESC</span></span
          >
        </div>
        <div class="notice__row notice__row--reason">
          <span class="notice__reason">Volta cancelada</span>
        </div>
      </section>
    </template>
    <script type="application/json" id="demo-config">
      { "eventTemplates": ["event-own", "event-fastest-lap", "event-incident"] }
    </script>

    <script src="../../../../node_modules/.pnpm/node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../../../../node_modules/.pnpm/node_modules/gsap/dist/CustomEase.min.js"></script>
    <script src="../../tools/motionDemoCore.js"></script>
    <script src="../../tools/motionDemoCards.js"></script>
  </body>
</html>
