<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — bracket, step 1</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="board bracket" data-graphic="bracket" data-step="1">
      <header class="card board__head">
        <img class="board__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
        <h1 class="board__title">Eliminatórias · Suspensão</h1>
        <span class="board__aside">1/3</span>
      </header>
      <div class="board__stage">
        <svg class="bracket__lines" viewBox="0 0 1728 900" aria-hidden="true"></svg>
        <div class="pill pill--head bracket__round-name" style="left: 0px; width: 512px">
          <span class="caption">Quartas de final</span>
        </div>
        <div class="pill pill--head bracket__round-name" style="left: 608px; width: 512px">
          <span class="caption">Semifinal</span>
        </div>
        <div class="pill pill--head bracket__round-name" style="left: 1216px; width: 512px">
          <span class="caption">Final</span>
        </div>
        <div
          class="bracket__match"
          style="left: 0px; top: 98px; width: 512px"
          data-match="quartas-1"
        >
          <div class="pill bracket-car" data-row data-winner>
            <span class="chip">98</span>
            <span class="bracket-car__team"
              ><span class="bracket-car__name">Carcará Baja</span
              ><span class="bracket-car__school">UFPR</span></span
            >
            <span class="bracket-car__result bracket-car__result--time">1:11,3</span>
          </div>
          <div class="pill bracket-car" data-row data-loser>
            <span class="chip">64</span>
            <span class="bracket-car__team"
              ><span class="bracket-car__name">Siriema Baja</span
              ><span class="bracket-car__school">UFMT</span></span
            >
            <span class="bracket-car__result bracket-car__result--time">1:14,9</span>
          </div>
        </div>
        <div
          class="bracket__match"
          style="left: 0px; top: 313px; width: 512px"
          data-match="quartas-2"
        >
          <div class="pill bracket-car" data-row data-loser>
            <span class="chip">41</span>
            <span class="bracket-car__team"
              ><span class="bracket-car__name">Mandacaru Baja</span
              ><span class="bracket-car__school">UFCG</span></span
            >
            <span class="bracket-car__result bracket-car__result--time">1:13,0</span>
          </div>
          <div class="pill bracket-car" data-row data-winner>
            <span class="chip">35</span>
            <span class="bracket-car__team"
              ><span class="bracket-car__name">Jaguatirica Off-Road</span
              ><span class="bracket-car__school">UFSC</span></span
            >
            <span class="bracket-car__result bracket-car__result--time">1:12,4</span>
          </div>
        </div>
        <div
          class="bracket__match"
          style="left: 0px; top: 528px; width: 512px"
          data-match="quartas-3"
        >
          <div class="pill bracket-car" data-row data-winner>
            <span class="chip">52</span>
            <span class="bracket-car__team"
              ><span class="bracket-car__name">Pequi Off-Road</span
              ><span class="bracket-car__school">UFG</span></span
            >
            <span class="bracket-car__result bracket-car__result--time">1:10,8</span>
          </div>
          <div class="pill bracket-car" data-row data-loser>
            <span class="chip">81</span>
            <span class="bracket-car__team"
              ><span class="bracket-car__name">Sucuri Racing</span
              ><span class="bracket-car__school">UFMS</span></span
            >
            <span class="bracket-car__result bracket-car__result--time">1:16,2</span>
          </div>
        </div>
        <div
          class="bracket__match"
          style="left: 0px; top: 743px; width: 512px"
          data-match="quartas-4"
        >
          <div class="pill bracket-car" data-row data-loser>
            <span class="chip">20</span>
            <span class="bracket-car__team"
              ><span class="bracket-car__name">Tatu-Bola Racing</span
              ><span class="bracket-car__school">UFBA</span></span
            >
            <span class="bracket-car__result bracket-car__result--time">1:15,6</span>
          </div>
          <div class="pill bracket-car" data-row data-winner>
            <span class="chip">44</span>
            <span class="bracket-car__team"
              ><span class="bracket-car__name">Ipê Amarelo Baja</span
              ><span class="bracket-car__school">UnB</span></span
            >
            <span class="bracket-car__result bracket-car__result--time">1:14,1</span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
