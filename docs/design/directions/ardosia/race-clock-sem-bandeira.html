<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — race clock without the flag</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="card race-clock race-clock--no-flag" data-graphic="race-clock">
      <header class="race-clock__head">
        <img class="race-clock__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
        <h1 class="race-clock__title">Enduro de Resistência</h1>
      </header>
      <div class="race-clock__body">
        <span class="race-clock__caption">TEMPO RESTANTE</span>
        <span class="race-clock__time">1:00:00</span>
        <span class="race-clock__laps">43 VOLTAS</span>
      </div>
    </section>
  </body>
</html>
