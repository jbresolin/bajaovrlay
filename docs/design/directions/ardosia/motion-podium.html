<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — movimento: Pódio · 3º, 2º e 1º com Próximo</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="demo-controls" aria-label="Controles da demonstração">
      <a class="demo-controls__back" href="motion-catalogo.html">Catálogo</a>
      <span class="demo-controls__title">Pódio · 3º, 2º e 1º com Próximo</span>
      <button type="button" class="demo-controls__button" data-action="enter">Entrar</button>
      <button type="button" class="demo-controls__button" data-action="exit">Sair</button>
      <button type="button" class="demo-controls__button" data-action="next">Próximo</button>
      <span class="demo-controls__status" id="demo-status" role="status"></span>
    </nav>
    <div class="demo-stage" data-demo="podium">
      <section class="board podium" data-graphic="podium" data-step="3">
        <header class="card board__head">
          <img class="board__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
          <h1 class="board__title">Pódio · Enduro de Resistência</h1>
          <span class="board__aside">3/3</span>
        </header>
        <div class="board__stage">
          <div class="podium__places">
            <div class="card podium-place podium-place--2" data-row data-revealed>
              <span class="logo logo--on-light podium-place__logo"
                ><img
                  class="logo__image"
                  src="../../sample_data/logos/teams/10.webp"
                  alt="Equipe Komiketo Baja"
                  width="480"
                  height="468"
              /></span>
              <span class="podium-place__pos">2º</span>
              <span class="chip chip--large">10</span>
              <span class="podium-place__name">Equipe Komiketo Baja</span>
              <span class="podium-place__school">UFSJ</span>
            </div>
            <div class="card podium-place podium-place--1" data-row data-revealed>
              <span class="logo logo--on-dark podium-place__logo"
                ><img
                  class="logo__image"
                  src="../../sample_data/logos/teams/51.webp"
                  alt="Sinuelo"
                  width="480"
                  height="335"
              /></span>
              <span class="podium-place__pos">1º</span>
              <span class="chip chip--large">51</span>
              <span class="podium-place__name">Sinuelo</span>
              <span class="podium-place__school">FAHOR</span>
            </div>
            <div class="card podium-place podium-place--3" data-row data-revealed>
              <span class="logo logo--on-light podium-place__logo"
                ><img
                  class="logo__image"
                  src="../../sample_data/logos/teams/47.webp"
                  alt="Pato Baja"
                  width="456"
                  height="480"
              /></span>
              <span class="podium-place__pos">3º</span>
              <span class="chip chip--large">47</span>
              <span class="podium-place__name">Pato Baja</span>
              <span class="podium-place__school">UTFPR-PB</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="../../vendor/gsap/gsap.min.js"></script>
    <script src="../../vendor/gsap/CustomEase.min.js"></script>
    <script src="../../tools/motionDemoCore.js"></script>
    <script src="../../tools/motionDemoBoards.js"></script>
  </body>
</html>
