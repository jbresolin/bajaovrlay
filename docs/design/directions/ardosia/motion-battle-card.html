<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — movimento: Disputa · diferença e tendência a cada volta</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="demo-controls" aria-label="Controles da demonstração">
      <a class="demo-controls__back" href="motion-catalogo.html">Catálogo</a>
      <span class="demo-controls__title">Disputa · diferença e tendência a cada volta</span>
      <button type="button" class="demo-controls__button" data-action="enter">Entrar</button>
      <button type="button" class="demo-controls__button" data-action="exit">Sair</button>
      <button type="button" class="demo-controls__button" data-action="update">Atualizar</button>
      <span class="demo-controls__status" id="demo-status" role="status"></span>
    </nav>
    <div class="demo-stage" data-demo="battle-card">
      <section class="battle-card" data-graphic="battle-card">
        <div class="pill battle-car" data-row>
          <span class="row__pos">4</span>
          <span class="chip">78</span>
          <span class="battle-car__team"
            ><span class="battle-car__name">Arara Off-Road</span
            ><span class="battle-car__school">UNIFEI</span></span
          >
          <span class="battle-car__laps">33 VOLTAS</span>
        </div>
        <div class="card battle-gap">
          <span class="battle-gap__value">+8,3</span>
          <span class="battle-gap__trend" data-trend="closing"
            ><svg viewBox="0 0 24 10" aria-hidden="true">
              <path d="M0 0l9 5-9 5z" fill="currentColor" />
              <path d="M24 0l-9 5 9 5z" fill="currentColor" /></svg
            ><span class="battle-gap__trend-words">FECHANDO −0,7</span></span
          >
        </div>
        <div class="pill battle-car" data-row>
          <span class="row__pos">5</span>
          <span class="chip">52</span>
          <span class="battle-car__team"
            ><span class="battle-car__name">Pequi Off-Road</span
            ><span class="battle-car__school">UFG</span></span
          >
          <span class="battle-car__laps">33 VOLTAS</span>
        </div>
      </section>
    </div>
    <template id="trend-closing">
      <span class="battle-gap__trend" data-trend="closing"
        ><svg viewBox="0 0 24 10" aria-hidden="true">
          <path d="M0 0l9 5-9 5z" fill="currentColor" />
          <path d="M24 0l-9 5 9 5z" fill="currentColor" /></svg
        ><span class="battle-gap__trend-words">FECHANDO </span></span
      >
    </template>
    <template id="trend-opening">
      <span class="battle-gap__trend" data-trend="opening"
        ><svg viewBox="0 0 24 10" aria-hidden="true">
          <path d="M9 0 0 5l9 5z" fill="currentColor" />
          <path d="M15 0l9 5-9 5z" fill="currentColor" /></svg
        ><span class="battle-gap__trend-words">ABRINDO </span></span
      >
    </template>
    <template id="trend-steady">
      <span class="battle-gap__trend" data-trend="steady"
        ><svg viewBox="0 0 24 10" aria-hidden="true">
          <rect x="2" y="4" width="20" height="2" fill="currentColor" /></svg
        ><span class="battle-gap__trend-words">ESTÁVEL</span></span
      >
    </template>
    <script type="application/json" id="demo-config">
      {
        "updates": [
          { "gapText": "+8,3", "trend": "closing", "trendWords": "FECHANDO −0,7" },
          { "gapText": "+7,9", "trend": "closing", "trendWords": "FECHANDO −0,4" },
          { "gapText": "+8,6", "trend": "opening", "trendWords": "ABRINDO +0,6" },
          { "gapText": "+8,6", "trend": "steady", "trendWords": "ESTÁVEL" }
        ]
      }
    </script>

    <script src="../../../../node_modules/.pnpm/node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../../../../node_modules/.pnpm/node_modules/gsap/dist/CustomEase.min.js"></script>
    <script src="../../tools/motionDemoCore.js"></script>
    <script src="../../tools/motionDemoCards.js"></script>
  </body>
</html>
