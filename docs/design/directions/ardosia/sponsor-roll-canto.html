<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — sponsor roll, corner</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="card sponsor-bug sponsor-roll-corner" data-graphic="sponsor-roll-corner">
      <img class="sponsor-bug__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
      <span class="sponsor-bug__label">ENDURO</span>
      <div class="sponsor-roll-corner__sponsor">
        <svg class="sponsor-mark" viewBox="0 0 48 48" role="img" aria-label="Patrocinador A">
          <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.5" />
          <text
            x="24"
            y="31.5"
            text-anchor="middle"
            font-size="22"
            font-family="Bebas Neue, sans-serif"
            fill="currentColor"
          >
            A
          </text>
        </svg>
        <span class="sponsor-roll-corner__words"
          ><span class="caption">Apresentado por</span
          ><span class="sponsor-bug__sponsor-name">Patrocinador A</span></span
        >
      </div>
    </section>
  </body>
</html>
