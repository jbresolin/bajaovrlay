<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — team card</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="card team-card" data-graphic="team-card">
      <div
        class="team-card__photo"
        role="img"
        aria-label="Foto do carro 31"
        style="background-image: url('../../../brand/frames/3.jpg')"
      ></div>
      <div class="team-card__identity">
        <div class="team-card__title">
          <span class="chip chip--large">31</span>
          <span class="team-card__name">Acauã Baja</span>
        </div>
        <div class="team-card__details">
          <span class="team-card__school">Mauá</span>
          <span class="team-card__city">São Caetano do Sul · SP</span>
        </div>
      </div>
      <div class="team-card__logo">
        <svg
          class="sponsor-mark"
          viewBox="0 0 48 48"
          role="img"
          aria-label="Logo da equipe Acauã Baja"
        >
          <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.5" />
          <text
            x="24"
            y="31.5"
            text-anchor="middle"
            font-size="22"
            font-family="Bebas Neue, sans-serif"
            fill="currentColor"
          >
            AB
          </text>
        </svg>
      </div>
    </section>
  </body>
</html>
