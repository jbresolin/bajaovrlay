<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — combo: lower third and message ticker</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="lower-strip message-ticker" data-graphic="message-ticker">
      <div class="card lower-strip__clock">
        <span class="lower-strip__time">1:00:00</span>
        <span class="flag-surface flag-pill lower-strip__flag" data-flag="green"
          ><span class="flag-word">VERDE</span></span
        >
      </div>
      <div class="message-ticker__pages">
        <div class="pill pill--head message-ticker__label"><span class="caption">AVISO</span></div>
        <div class="pill message-ticker__message">Largada do enduro às 10h00</div>
      </div>
      <div class="card lower-strip__page">1/3</div>
    </section>
    <section class="lower-third" data-graphic="lower-third">
      <div class="card lower-third__name">Carlos Henrique Lima</div>
      <div class="card lower-third__role">
        <span class="lower-third__role-text">Diretor de prova</span>
      </div>
    </section>
  </body>
</html>
