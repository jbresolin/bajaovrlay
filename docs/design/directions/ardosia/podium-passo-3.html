<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — podium, step 3</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="board podium" data-graphic="podium" data-step="3">
      <header class="card board__head">
        <img class="board__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
        <h1 class="board__title">Pódio · Enduro de Resistência</h1>
        <span class="board__aside">3/3</span>
      </header>
      <div class="board__stage">
        <div class="podium__places">
          <div class="card podium-place podium-place--2" data-row data-revealed>
            <span class="podium-place__pos">2º</span>
            <span class="chip chip--large">10</span>
            <span class="podium-place__name">Equipe Komiketo Baja</span>
            <span class="podium-place__school">UFSJ</span>
          </div>
          <div class="card podium-place podium-place--1" data-row data-revealed>
            <span class="podium-place__pos">1º</span>
            <span class="chip chip--large">51</span>
            <span class="podium-place__name">Sinuelo</span>
            <span class="podium-place__school">FAHOR</span>
          </div>
          <div class="card podium-place podium-place--3" data-row data-revealed>
            <span class="podium-place__pos">3º</span>
            <span class="chip chip--large">47</span>
            <span class="podium-place__name">Pato Baja</span>
            <span class="podium-place__school">UTFPR-PB</span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
