  <body>
    <nav class="demo-controls" aria-label="Controles da demonstração">
      <a class="demo-controls__back" href="motion-catalogo.html">Catálogo</a>
      <span class="demo-controls__title">Intervalo · sem classificação, com patrocinadores</span>

      <span class="demo-controls__status" id="demo-status" role="status"></span>
    </nav>
    <div class="demo-stage" data-demo="intermission">
      <section class="board board--narrow intermission" data-graphic="intermission-board">

          <img class="board__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
          <h1 class="board__title">Intervalo</h1>

          <div class="card intermission__next">
            <span class="caption">A SEGUIR</span>
            <span class="intermission__session">Suspensão</span>
            <span class="intermission__countdown">23:45</span>
            <span class="intermission__start">LARGADA ÀS 13:30</span>
          </div>
        </div>
        <div class="card intermission__sponsors">
          <span class="caption">PATROCÍNIO</span>
          <span class="intermission__sponsor"
            ><svg class="sponsor-mark" viewBox="0 0 48 48" role="img" aria-label="Patrocinador A">
              <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.5" />
              <text
                x="24"
                y="31.5"
                text-anchor="middle"
                font-size="22"
                font-family="Bebas Neue, sans-serif"

                A

              >
                B
              </text></svg
            ><span>Patrocinador B</span></span
          >
          <span class="intermission__sponsor"
            ><svg class="sponsor-mark" viewBox="0 0 48 48" role="img" aria-label="Patrocinador C">

              <text
                x="24"
                y="31.5"
                text-anchor="middle"

                D
