<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — movimento: Intervalo · sem classificação, com patrocinadores</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="demo-controls" aria-label="Controles da demonstração">
      <a class="demo-controls__back" href="motion-catalogo.html">Catálogo</a>
      <span class="demo-controls__title">Intervalo · sem classificação, com patrocinadores</span>
      <button type="button" class="demo-controls__button" data-action="enter">Entrar</button>
      <button type="button" class="demo-controls__button" data-action="exit">Sair</button>
      <span class="demo-controls__status" id="demo-status" role="status"></span>
    </nav>
    <div class="demo-stage" data-demo="intermission">
      <section class="board board--narrow intermission" data-graphic="intermission-board">
        <header class="card board__head">
          <img class="board__logo" src="../../../brand/logo-branca.png" alt="Baja SAE Brasil" />
          <h1 class="board__title">Intervalo</h1>
          <span class="caption board__subtitle">30ª Competição Baja SAE Brasil</span>
          <span class="board__aside">domingo, 30 de março de 2025</span>
        </header>
        <div class="intermission__body intermission__body--single">
          <div class="card intermission__next">
            <span class="caption">A SEGUIR</span>
            <span class="intermission__session">Enduro de Resistência</span>
            <span class="intermission__countdown">23:45</span>
            <span class="intermission__start">LARGADA ÀS 10:00</span>
          </div>
        </div>
        <div class="card intermission__sponsors">
          <span class="caption">PATROCÍNIO</span>
          <span class="logo logo--on-light intermission__sponsor"
            ><img
              class="logo__image"
              src="../../sample_data/logos/sponsors/bosch.webp"
              alt="Bosch"
              width="480"
              height="138"
          /></span>
          <span class="logo logo--on-light intermission__sponsor"
            ><img
              class="logo__image"
              src="../../sample_data/logos/sponsors/renault.webp"
              alt="Renault"
              width="150"
              height="56"
          /></span>
          <span class="logo logo--on-light intermission__sponsor"
            ><img
              class="logo__image"
              src="../../sample_data/logos/sponsors/certi.webp"
              alt="Certi"
              width="138"
              height="52"
          /></span>
          <span class="logo logo--on-light intermission__sponsor"
            ><img
              class="logo__image"
              src="../../sample_data/logos/sponsors/cnh.webp"
              alt="CNH"
              width="480"
              height="161"
          /></span>
        </div>
      </section>
    </div>

    <script type="application/json" id="demo-config">
      { "remainingSeconds": 1425 }
    </script>

    <script src="../../vendor/gsap/gsap.min.js"></script>
    <script src="../../vendor/gsap/CustomEase.min.js"></script>
    <script src="../../tools/motionDemoCore.js"></script>
    <script src="../../tools/motionDemoBoards.js"></script>
  </body>
</html>
