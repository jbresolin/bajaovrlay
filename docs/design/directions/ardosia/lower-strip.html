<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — lower strip</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="lower-strip" data-graphic="lower-strip">
      <div class="card lower-strip__clock">
        <span class="lower-strip__time">1:00:00</span>
        <span class="flag-surface flag-pill lower-strip__flag" data-flag="green"
          ><span class="flag-word">VERDE</span></span
        >
      </div>
      <div class="lower-strip__pages">
        <ol class="lower-strip__cars">
          <li class="pill strip-car" data-row data-status="running" data-leader>
            <span class="strip-car__pos">1º</span>
            <span class="strip-car__car chip">51</span>
            <span class="strip-car__school">Sinuelo</span>
          </li>
          <li class="pill strip-car" data-row data-status="running">
            <span class="strip-car__pos">2º</span>
            <span class="strip-car__car chip">10</span>
            <span class="strip-car__school">Komiketo</span>
          </li>
          <li class="pill strip-car" data-row data-status="running">
            <span class="strip-car__pos">3º</span>
            <span class="strip-car__car chip">47</span>
            <span class="strip-car__school">Pato</span>
          </li>
          <li class="pill strip-car" data-row data-status="running">
            <span class="strip-car__pos">4º</span>
            <span class="strip-car__car chip">1</span>
            <span class="strip-car__school">FEI</span>
          </li>
          <li class="pill strip-car" data-row data-status="running">
            <span class="strip-car__pos">5º</span>
            <span class="strip-car__car chip">8</span>
            <span class="strip-car__school">Imperador</span>
          </li>
          <li class="pill strip-car" data-row data-status="running">
            <span class="strip-car__pos">6º</span>
            <span class="strip-car__car chip">16</span>
            <span class="strip-car__school">Forja</span>
          </li>
        </ol>
      </div>
      <div class="card lower-strip__page">1/6</div>
    </section>
  </body>
</html>
