<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ardosia — team card without photo and logo</title>
    <link rel="stylesheet" href="../../fonts/fonts.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="card team-card" data-graphic="team-card">
      <div class="team-card__identity">
        <div class="team-card__title">
          <span class="chip chip--large">38</span>
          <span class="team-card__name">Coruja Racing</span>

          <span class="team-card__school">EESC-USP</span>

        </div>
      </div>
    </section>
  </body>
