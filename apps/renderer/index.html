<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>BajaOvrLay renderer</title>
    <!--
      The on-air theme (packages/theme, served by the server at /theme/): the tokens go on
      :root and the font is registered on this page, before the module script below runs,
      because a stylesheet in the head is loaded before a module script starts. Every
      graphic reads the tokens as var(--panel-base) inside its shadow root and carries no
      fallback values; the font file is preloaded so the first frame on air has the face.
      `vite-ignore` keeps Vite from looking for these files in this package: they come from
      the server, in development through the dev server's proxy (vite.config.ts).
    -->
    <link rel="stylesheet" href="/theme/ardosia/tokens.css" vite-ignore />
    <link rel="stylesheet" href="/theme/fonts/fonts.css" vite-ignore />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/theme/fonts/bebas-neue/bebas-neue-latin-400-normal.woff2"
      vite-ignore
    />
    <style>
      /*
       * Everything outside the graphics must be transparent so OBS shows the video
       * underneath. The stage is fixed at the 1920x1080 stream canvas size; set the
       * OBS browser source to 1920x1080 too, or the graphics will be cropped or scaled.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }

      #stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-testid="renderer-stage"></div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
