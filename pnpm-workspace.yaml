packages:
  - apps/*
  - packages/*
  # Each OGraf graphic is its own package; BAJAOVRLAY-10 adds the first one here.
  - packages/graphics/*
# One Playwright version for the whole workspace: CI installs the browser once, from the
# root, for that exact version. Every package with browser tests uses "catalog:".
catalog:
  '@playwright/test': 1.62.0
allowBuilds:
  esbuild: true
