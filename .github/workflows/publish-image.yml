# Publishes the Docker image of the whole system (Dockerfile) to GitHub's registry on every
# push to main, as ghcr.io/jbresolin/bajaovrlay:latest and :<short sha> (BAJAOVRLAY-34).
# TrueNAS pulls :latest; the stream PC gets it on a USB stick (deploy/README.md).
#
# A workflow of its own, not a job of ci.yml, on purpose: "CI passed" never waits for it
# and never turns red because of it, and it never runs on a pull request or a draft. A
# failed publish shows as a red run of "Publish image" on the Actions page and on the
# commit in main, and nowhere in the merge rule. It does not wait for CI either: a merge
# reaches main only on a green "CI passed" (docs/ci.md).
name: Publish image

on:
  push:
    branches: [main]

# Two merges in a row: the second one's image is the one :latest must end on, so the older
# run is cancelled rather than left to finish after it and overwrite :latest.
concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read
  # Writes the image to ghcr.io under this repository's owner.
  packages: write

jobs:
  publish-image:
    name: Build and push the image to GHCR
    runs-on: ubuntu-latest
    # The build takes about 3 minutes from a cold cache; 20 means something is stuck.
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The short sha, as `git log --oneline` writes it, names this exact build.
      - name: Read the short sha of the commit
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR with this run's token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64: TrueNAS and the stream PC both. The layer cache is kept in GitHub's
      # Actions cache, so a merge that changes no dependency skips the package download.
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jbresolin/bajaovrlay:latest
            ghcr.io/jbresolin/bajaovrlay:${{ steps.commit.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
