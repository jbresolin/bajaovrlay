# What a pull request must pass before João merges it: the last job, "CI passed", is green
# only when every other job passed (docs/ci.md). The jobs run side by side, each on its own
# runner, so a run takes as long as its slowest job (BAJAOVRLAY-42).
name: CI

# A pull request opens as a draft and goes through gate 2 (João's review rounds) with no CI
# run at all: every push of a review round would otherwise run the whole suite and bill
# its minutes. CI runs when the pull request is marked ready for review, which happens once
# gate 2 has passed, and on every push to it after that; and on every push to main. The
# agent runs `pnpm verify` before each push instead (CLAUDE.md, "Git and process").
# "Run workflow" (workflow_dispatch) runs it by hand on any branch, to measure a draft.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# On a pull request a newer push makes the older run pointless, so it is cancelled. On main
# every merge keeps its own run, so each merge gets its own verdict: a push is grouped by its
# commit, since GitHub keeps only one waiting run per group and would drop the others.
#
# The group ends in "draft" or "ready", read from the event, so a run that skips every job
# (its event says draft) only ever cancels another draft run. Without it, a push landing
# within a second of "ready for review" started a run whose event still read the PR as a
# draft, and that skipped run cancelled the real one (#62, BAJAOVRLAY-72, docs/ci.md).
# A push to main or a run by hand has no pull request, so it reads "ready".
# What could go wrong: a ready PR turned back into a draft keeps its last ready run going
# to the end, since the draft push that follows is in the other group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit and component tests (Vitest)
    # Skipped on a draft pull request (see the triggers above).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 15 since BAJAOVRLAY-42: about 4 minutes expected, so 15 means something is stuck.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies exactly as locked
        run: pnpm install --frozen-lockfile

      - name: Unit and component tests (Vitest)
        run: pnpm test

      # The 15 slowest test files and tests of this job, on the run's summary page, from
      # the JSON report Vitest writes on CI (docs/ci.md). After a failure too: a test that
      # turned slow may be why the run failed. A missing report is named, not fatal.
      - name: Report the slowest tests
        if: always()
        run: node scripts/reportSlowestTests.js vitest-report.json >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Lint, typecheck, build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # About 5 minutes expected (BAJAOVRLAY-58: lint 1:17, typecheck 2:36, build 0:24 on #44),
    # so 15 means something is stuck. No browser here: the browser tests have jobs of their own.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies exactly as locked
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint and Prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build every package
        run: pnpm build

  browser-tests-of-renderer-and-graphics:
    name: Browser tests of the renderer and graphics (shard ${{ matrix.shard }} of 2)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # About 6 to 7 minutes expected per shard (docs/ci.md). Split again before a shard
    # passes 10, rather than raising this.
    timeout-minutes: 15
    strategy:
      # Both shards run to the end even if one fails, so a run names every failing test.
      fail-fast: false
      matrix:
        # Split by package, not with Playwright's --shard (BAJAOVRLAY-58). --shard keeps a
        # package's dependent projects together (the renderer's real-server chain, the
        # tower's frame budget), which on #44's times put about 8:20 of tests in one shard
        # and 2:20 in the other. By package: the three slowest (bracket 2:14, renderer
        # 1:50, tower 1:02) in shard 1, every other package in shard 2, about 5:10 and
        # 4:40. A new graphic lands in shard 2 without any change here.
        shard: [1, 2]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies exactly as locked
        run: pnpm install --frozen-lockfile

      # Built here, not downloaded from "Lint, typecheck, build": the build takes about
      # half a minute (0:24 on #44), while waiting for that job's build would hold every
      # browser test back until its lint and typecheck had run (about 5 minutes).
      - name: Build every package
        run: pnpm build

      # The browser is kept between runs under the exact @playwright/test version, which
      # the pnpm catalog pins for every package. On a hit the install below finds it and
      # skips the download; its system packages (--with-deps) still come from apt. The key
      # also names the runner image (ImageOS, e.g. ubuntu24) and the architecture, so a new
      # Ubuntu image never restores a Chromium built for the old one.
      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-${{ runner.os }}-${{ env.ImageOS }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      # 5 minutes: it takes about half a minute, but a slow apt mirror once made it 12:51.
      # Past 5 it stops here, by name, instead of using up the job's 15. A failed or slow
      # download is tried once more in the next step: that retries a download, never a
      # test (docs/ci.md).
      - name: Install the Playwright browser
        id: install-browser
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium

      # Runs only when the first try failed or passed its 5 minutes; if this one fails too,
      # the job fails here.
      - name: Install the Playwright browser, second try
        if: steps.install-browser.outcome == 'failure'
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium

      # One package at a time inside a shard, so their browsers do not compete for the
      # runner's two cores. The tower's frame budget runs after the tower's other tests
      # (a Playwright dependency in its own config), in shard 1.
      - name: Browser tests of the renderer, bracket and positions tower (Playwright)
        if: matrix.shard == 1
        run: pnpm test:e2e:renderer-bracket-tower

      - name: Browser tests of the other graphics and the server (Playwright)
        if: matrix.shard == 2
        run: pnpm test:e2e:other-graphics-and-server

      # Each shard reads the reports its own packages wrote. In shard 2 the renderer's is
      # named as missing: it ran in shard 1.
      - name: Report the slowest tests
        if: always()
        run: >-
          node scripts/reportSlowestTests.js
          apps/renderer/test-results/playwright-results.json
          packages/graphics/*/test-results/playwright-results.json
          >> "$GITHUB_STEP_SUMMARY"

      # Screenshots, traces and the HTML report from a failed run, for debugging and for
      # taking screenshot baselines rendered on CI's Linux.
      - name: Upload Playwright results
        # A job past its timeout ends as cancelled, and its traces matter most then.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-renderer-and-graphics-shard-${{ matrix.shard }}
          path: |
            apps/renderer/test-results/
            apps/renderer/playwright-report/
            apps/server/test-results/
            apps/server/playwright-report/
            packages/**/test-results/
            packages/**/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  browser-tests-of-control:
    name: Browser tests of the control page (shard ${{ matrix.shard }} of 2)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 15 since BAJAOVRLAY-42: about 5 minutes expected per shard.
    timeout-minutes: 15
    strategy:
      # Both shards run to the end even if one fails, so a run names every failing test.
      fail-fast: false
      matrix:
        # Two shards, each on a runner of its own with its own server, database and ports:
        # about 4 minutes of tests each instead of 7,5 in one job (docs/ci.md).
        shard: [1, 2]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies exactly as locked
        run: pnpm install --frozen-lockfile

      # The control page's browser tests need the built graphics: the server registers
      # built graphics only.
      - name: Build every package
        run: pnpm build

      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      # Same key as in the renderer and graphics job (image, architecture, Playwright version).
      - name: Restore the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-${{ runner.os }}-${{ env.ImageOS }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      # 5 minutes per try, and one more try after a failed or slow download, as in the
      # renderer and graphics job: on #43 a control shard's install hit its 5 minutes on a
      # slow download (BAJAOVRLAY-58).
      - name: Install the Playwright browser
        id: install-browser
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium

      - name: Install the Playwright browser, second try
        if: steps.install-browser.outcome == 'failure'
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests of the control page (Playwright)
        run: pnpm test:e2e:control --shard=${{ matrix.shard }}/2

      - name: Report the slowest tests
        if: always()
        run: >-
          node scripts/reportSlowestTests.js apps/control/test-results/playwright-results.json
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright results
        # A job past its timeout ends as cancelled, and its traces matter most then.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-control-shard-${{ matrix.shard }}
          path: |
            apps/control/test-results/
            apps/control/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  chaos-suite:
    name: Chaos suite (Playwright)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The failure scenarios of apps/control/e2e/chaos (BAJAOVRLAY-32): about 4 minutes of
    # tests on João's machine, kept under 8 by the brief; 15 means something is stuck. A job
    # of its own: every scenario starts, kills and restarts servers of its own, on ports of
    # its own, so it shares a runner with no other browser test.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies exactly as locked
        run: pnpm install --frozen-lockfile

      # The scenarios run the BUILT server, which serves the built control page and
      # renderer, as on the stream PC.
      - name: Build every package
        run: pnpm build

      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      # Same key as in the other browser jobs (image, architecture, Playwright version).
      - name: Restore the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-${{ runner.os }}-${{ env.ImageOS }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      # 5 minutes per try, and one more try after a failed or slow download, as in the
      # other browser jobs.
      - name: Install the Playwright browser
        id: install-browser
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium

      - name: Install the Playwright browser, second try
        if: steps.install-browser.outcome == 'failure'
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium

      - name: Chaos suite (Playwright)
        run: pnpm test:chaos

      - name: Report the slowest tests
        if: always()
        run: >-
          node scripts/reportSlowestTests.js apps/control/test-results-chaos/playwright-results.json
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright results
        # A job past its timeout ends as cancelled, and its traces matter most then.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-chaos-suite
          path: |
            apps/control/test-results-chaos/
            apps/control/playwright-report-chaos/
          if-no-files-found: ignore
          retention-days: 14

  # The one line a pull request shows for its merge: green only when every job above
  # passed. A job that failed, was cancelled or was skipped makes it red. Branch protection
  # is not available on this repository's plan, so nothing enforces it: João merges only
  # on a green "CI passed".
  ci-passed:
    name: CI passed
    needs:
      - unit-tests
      - checks
      - browser-tests-of-renderer-and-graphics
      - browser-tests-of-control
      - chaos-suite
    # !cancelled(): it must run, and turn red, even when a job it needs failed or timed out,
    # but not when the whole run was cancelled (a newer push replaced it). Inside ${{ }}
    # because a YAML value cannot start with "!".
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # scripts/checkJobResults.sh: red unless every result is "success" (tested by
      # checkJobResults.test.ts).
      - name: Check that every job passed
        env:
          RESULTS_OF_THE_JOBS: ${{ join(needs.*.result, ' ') }}
        run: bash scripts/checkJobResults.sh
